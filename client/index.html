<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAUMADO2</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    /* --u = 1 pixel del canvas (320x200) en pantalla; sirve para ubicar los campos HTML encima */
    #game { --u: calc(min(100vw, 160vh) / 320); position: relative; width: calc(var(--u) * 320); height: calc(var(--u) * 200); margin: 0 auto; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
    #name {
      position: absolute; left: calc(var(--u) * 30); top: calc(var(--u) * 70);
      width: calc(var(--u) * 212); height: calc(var(--u) * 16); box-sizing: border-box;
      background: rgba(0, 0, 0, 0.75); border: calc(var(--u) * 1) solid #d02020; color: #fff;
      font: bold calc(var(--u) * 8) monospace; text-align: center; outline: none;
    }
    #name::placeholder { color: #9a9a9a; }
    #name:focus { border-color: #ffd23f; }
    #ok {
      position: absolute; left: calc(var(--u) * 248); top: calc(var(--u) * 70);
      width: calc(var(--u) * 42); height: calc(var(--u) * 16); box-sizing: border-box;
      background: #d02020; border: calc(var(--u) * 1) solid #000; color: #fff;
      font: bold calc(var(--u) * 8) monospace; cursor: pointer;
    }
    #ok:hover, #ok:focus { background: #ffd23f; color: #000; outline: none; }
    #name[hidden], #ok[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="screen" width="320" height="200"></canvas>
    <input id="name" maxlength="60" autocomplete="off" spellcheck="false" hidden
           placeholder="Ingrese su nombre completo... y elija su destino">
    <button id="ok" hidden>OK</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
